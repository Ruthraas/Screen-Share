[package]
name = "screenshare"
version = "2.0.0"
description = "ScreenShare desktop app"
authors = ["ScreenShare"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "screenshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ScreenShare"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
# Verificar/instalar atualizações (issue #48) — manifesto e chave de
# assinatura já publicados pela infraestrutura (issue #49,
# `plugins.updater` em tauri.conf.json). No Windows, `Update::install()`/
# `downloadAndInstall()` já reinicia o app sozinho depois de lançar o
# instalador — não precisa do plugin `process`/`relaunch()` (produto é
# Windows-only, ver README).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Captura de tela nativa (issue #8) — Windows Graphics Capture, sem getDisplayMedia/
# navegador (decisao explicita do produto). So entrega frames crus; a codificacao
# JPEG por frame (pra chegar no frontend) usa a crate `image` abaixo.
windows-capture = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
# Audio do sistema (loopback) pra compartilhar junto da tela — decisao de
# produto de 2026-09-13, nunca microfone (ver src/audio.rs).
wasapi = "0.24"
# So pra DwmGetWindowAttribute (DWMWA_CLOAKED) em list_capture_sources —
# `windows-capture` ja usa a versao 0.62.x da crate `windows` internamente,
# fixando a mesma versao aqui reusa a mesma compilacao em vez de puxar outra.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
