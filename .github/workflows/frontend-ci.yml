name: Frontend CI

# Issue #5: torna verificável o build React/TypeScript/Rust e o empacotamento
# Windows, com um smoke test cobrindo login, shell, configurações e logout
# contra uma fixture local (issue #30: as rotas /v1/auth/* são interceptadas
# em scripts/check-ui.mjs — nenhuma credencial ou backend real é usado, então
# uma falha aqui nunca expõe token nem conteúdo de .env.local).
#
# Só Windows por agora, mesmo critério do backend-ci.yml: é o ambiente de
# desenvolvimento real (Ruthraas) e o único validado até aqui.

on:
  # Sem filtro de path em pull_request de propósito — mesmo achado do
  # backend-ci.yml (ver comentário lá): a proteção da branch main exige os
  # dois checks em toda PR, e uma PR que só toca backend/ nunca dispara este
  # workflow com filtro de path, deixando "Frontend build-and-test" pendente
  # pra sempre e travando o merge (achado com PRs reais do Dependabot,
  # #91/#92). push continua filtrado — não bloqueia merge, só evita rodar à
  # toa depois que já mergeou.
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "tests/frontend/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - "oauth.html"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    # Nome explícito — mesmo motivo do backend-ci.yml: sem isso colide com
    # o job de mesmo nome lá, indistinguível numa lista de checks de PR.
    name: Frontend build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários (Node --test)
        run: npm run test:frontend

      - name: Build (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Testes Rust da ponte desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Instalar navegador do Playwright
        run: npx playwright install chromium

      - name: Smoke test (login, shell, configurações, logout — fixture local)
        run: npm run test:e2e

      - name: Empacotar Windows (ScreenShare.exe + instalador NSIS)
        run: npm run tauri:build

      - name: Publicar artefatos do bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshare-windows
          path: |
            src-tauri/target/release/ScreenShare.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar capturas do smoke test (diagnóstico em caso de falha)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-test-screenshots
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 14
