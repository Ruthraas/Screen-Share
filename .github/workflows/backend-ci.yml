name: Backend CI

# Issue #46: garante que os dois colaboradores (e qualquer PR) tenham
# build/test/migrações reproduzíveis, na mesma versão de Node que a issue
# #58 já fixou (Node 22, backend/.nvmrc) — a mesma dor de "funciona na
# minha máquina" que o #58 resolveu localmente, cobrida aqui também.
#
# Só Windows por agora (2026-09-12, a pedido do usuário) — é o ambiente de
# desenvolvimento real (Ruthraas) e o único validado até aqui. Build pra
# Linux fica pra depois que o fluxo no Windows estiver redondo; ver
# docs/BACKEND.md antes de reativar o matrix com ubuntu-latest.

on:
  # Sem filtro de path em pull_request de propósito (achado real, 2026-09-18):
  # a proteção da branch main exige os dois checks (Backend + Frontend
  # build-and-test) em toda PR. Com filtro de path, uma PR que só toca
  # backend/ nunca dispara o frontend-ci.yml — o check "Frontend
  # build-and-test" fica pendente pra sempre (nunca reporta status, sucesso
  # nem falha) e trava o merge indefinidamente, mesmo sem nada de errado
  # (achado com PRs reais do Dependabot, #91/#92). GitHub documenta esse
  # exato problema com checks obrigatórios + workflow filtrado por path.
  # push continua filtrado — ali não bloqueia merge, só evita rodar de novo
  # à toa depois que já mergeou.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    # Nome explícito: sem isso, o check aparece só como "build-and-test" —
    # igual ao job de mesmo nome no frontend-ci.yml, indistinguível numa
    # lista de checks de PR (e ambíguo pra branch protection referenciar).
    name: Backend build-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências (sem compilar nativo — ver backend/.npmrc)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Migrações em banco vazio
        shell: pwsh
        env:
          DATABASE_PATH: ./ci-migrate-check.db
          SESSION_SIGNING_SECRET: ci-only-signing-secret-32-characters-min
          PASSWORD_PEPPER: ci-only-pepper-16-chars
          OAUTH_REDIRECT_BASE_URL: http://127.0.0.1:8787
          TURN_KEY_ID: ci-only-turn-key-id
          TURN_KEY_API_TOKEN: ci-only-not-a-real-secret
        run: |
          npm run migrate
          Remove-Item -ErrorAction SilentlyContinue ./ci-migrate-check.db
