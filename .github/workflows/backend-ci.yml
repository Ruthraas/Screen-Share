name: Backend CI

# Issue #46: garante que os dois colaboradores (e qualquer PR) tenham
# build/test/migrações reproduzíveis, na mesma versão de Node que a issue
# #58 já fixou (Node 22, backend/.nvmrc) — a mesma dor de "funciona na
# minha máquina" que o #58 resolveu localmente, cobrida aqui também.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências (sem compilar nativo — ver backend/.npmrc)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Migrações em banco vazio (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -eu
          DATABASE_PATH=./ci-migrate-check.db \
          FIREBASE_SERVICE_ACCOUNT_JSON='{"project_id":"ci"}' \
          TURN_HOST=turn.ci.invalid \
          TURN_SECRET=ci-only-not-a-real-secret \
          npm run migrate
          rm -f ./ci-migrate-check.db

      - name: Migrações em banco vazio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATABASE_PATH: ./ci-migrate-check.db
          FIREBASE_SERVICE_ACCOUNT_JSON: '{"project_id":"ci"}'
          TURN_HOST: turn.ci.invalid
          TURN_SECRET: ci-only-not-a-real-secret
        run: |
          npm run migrate
          Remove-Item -ErrorAction SilentlyContinue ./ci-migrate-check.db
