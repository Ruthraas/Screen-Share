version: 2
updates:
  # Frontend (screen-share/package.json) — monorepo: app vive em
  # screen-share/, screen-share-site/ é repositório próprio, separado.
  - package-ecosystem: "npm"
    directory: "/screen-share"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Backend (screen-share/backend/package.json — projeto npm separado)
  - package-ecosystem: "npm"
    directory: "/screen-share/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Cargo (screen-share/src-tauri/Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/screen-share/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Actions usadas nos workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
