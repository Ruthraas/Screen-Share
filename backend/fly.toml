# Configuração do Fly.io pro backend (issue #82). Ver
# docs/backend/HOSPEDAGEM.md pro passo a passo completo de deploy.
#
# `app` abaixo é um nome sugerido — nomes de app no Fly são únicos
# globalmente; se estiver em uso, troque aqui (ou deixe `fly launch`
# escolher outro na hora de criar) antes do primeiro deploy.

app = "screenshare-backend"
primary_region = "gru" # São Paulo — troque se o time/usuários estiverem noutra região

[build]
  dockerfile = "Dockerfile"

# Só variáveis NÃO sensíveis aqui. Segredos reais (SESSION_SIGNING_SECRET,
# PASSWORD_PEPPER, *_CLIENT_SECRET, TURN_KEY_API_TOKEN) vão via
# `fly secrets set` — nunca neste arquivo, que é commitado no Git.
[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/data/screenshare.db"
  SIGNALING_PATH = "/ws"
  # CORS_ALLOWED_ORIGINS não precisa mudar em produção: a origem do
  # cliente empacotado (https://tauri.localhost / http://tauri.localhost)
  # é do WebView do Tauri, não muda com onde o backend está hospedado —
  # o default em src/config.ts já cobre isso.

# Volume persistente pro SQLite — sobrevive a deploy/restart, não é
# recriado como o resto do filesystem do container. Precisa existir antes
# do primeiro deploy (`fly volumes create screenshare_data ...`, mesmo
# nome do `source` abaixo, mesma região do `primary_region`).
[[mounts]]
  source = "screenshare_data"
  destination = "/data"

# `min_machines_running = 1` + `auto_stop_machines = "off"` mantém
# exatamente UMA máquina sempre no ar (nunca suspensa) — necessário pra
# WebSocket de sinalização ficar alcançável a qualquer momento (suspender
# a máquina derrubaria toda conexão WS aberta) e, mais importante ainda,
# pra nunca existir uma segunda máquina escrevendo no mesmo arquivo
# SQLite ao mesmo tempo (better-sqlite3 não foi desenhado pra múltiplos
# processos concorrentes no mesmo arquivo). NUNCA rodar `fly scale count`
# acima de 1 nesta app.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
